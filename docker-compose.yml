services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434" # exposed for convenience (e.g. `ollama pull` from the host); not required by the agent

  agent:
    build: .
    depends_on:
      - ollama
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma4:e2b-it-q4_K_M
      # dronefleet runs in its own repo/compose (see dronefleet's README).
      # host.docker.internal + the gateway entry below reach a dronefleet
      # instance running on the host; point this at dronefleet's container
      # name instead if you put both stacks on one Docker network.
      DRONEFLEET_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ollama-models:
